# Builds the Windows, Linux and Android apps from kmp/ and puts them on a public GitHub release.
# The .msi and .deb can only be made on their own OS, which is why this runs here and not on the Mac.
# Release: git tag native-v1.0.0 && git push origin native-v1.0.0
name: native release

on:
  workflow_dispatch:
  push:
    tags: ["native-v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, task: packageMsi, glob: "**/*.msi" }
          - { os: ubuntu-latest,  task: packageDeb, glob: "**/*.deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew :composeApp:${{ matrix.task }} --no-daemon
        working-directory: kmp
      - uses: actions/upload-artifact@v4
        with:
          name: sighting-${{ matrix.task }}
          path: kmp/composeApp/build/compose/binaries/**/${{ matrix.glob }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # ponytail: debug APK, sideloadable today. Swap to assembleRelease once a keystore is in secrets.
      - run: ./gradlew :composeApp:assembleDebug --no-daemon
        working-directory: kmp
      - run: mv kmp/composeApp/build/outputs/apk/debug/composeApp-debug.apk kmp/sighting.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sighting-apk
          path: kmp/sighting.apk

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Sighting ${GITHUB_REF_NAME#native-v} for Windows, Linux and Android" \
            --notes "The same lost and found board as sighting.jaybulb.com, as an app. Windows: the .msi. Linux: the .deb. Android: sighting.apk (sideload)." \
            $(find out -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.apk' \))
        env:
          GH_TOKEN: ${{ github.token }}
